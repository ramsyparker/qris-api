name = "qris-api-web"
main = "src/worker.ts"
compatibility_date = "2026-11-12"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/convert", "/decode", "/qr", "/api-reference", "/api-reference/*"]

[vars]
API_ORIGIN = "https://qris.fixorastudio.com"
